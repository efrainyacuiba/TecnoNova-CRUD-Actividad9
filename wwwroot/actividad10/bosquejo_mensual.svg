<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#f5f8fb"/><text x="32" y="37" font-family="Arial" font-size="24" font-weight="bold" fill="#16394c">TecnoNova | Bosquejo mensual</text><text x="32" y="60" font-family="Arial" font-size="14" fill="#42596c">Diseño de bandas y mapeo al esquema PostgreSQL de la Actividad 9</text><rect x="32" y="80" width="1136" height="112" rx="9" fill="#ffffff" stroke="#c6d5de"/><rect x="32" y="80" width="1136" height="29" rx="6" fill="#16566c"/><text x="46" y="100" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">HEADER / Encabezado</text><text x="46" y="131" font-family="Arial" font-size="17" font-weight="bold" fill="#16394c">TN TecnoNova | Reporte mensual de ventas</text><text x="46" y="155" font-family="Arial" font-size="14" fill="#40576b">Rango: @inicio / @fin · emisión: DateTime.Now · operador: generadoPor</text><text x="46" y="175" font-family="Arial" font-size="14" fill="#40576b">Logo y título: aplicación. Operador: dato ingresado; no existe tabla de usuarios.</text><rect x="32" y="206" width="1136" height="112" rx="9" fill="#ffffff" stroke="#c6d5de"/><rect x="32" y="206" width="1136" height="29" rx="6" fill="#16566c"/><text x="46" y="226" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">GROUP HEADER / Encabezado de grupo</text><text x="46" y="257" font-family="Arial" font-size="17" font-weight="bold" fill="#16394c">Mes 2026-10 / Mes 2026-11</text><text x="46" y="281" font-family="Arial" font-size="14" fill="#40576b">TO_CHAR(ventas.fecha, &#x27;YYYY-MM&#x27;)</text><text x="46" y="301" font-family="Arial" font-size="14" fill="#40576b">Una banda por cada mes del periodo.</text><rect x="32" y="332" width="1136" height="112" rx="9" fill="#ffffff" stroke="#c6d5de"/><rect x="32" y="332" width="1136" height="29" rx="6" fill="#16566c"/><text x="46" y="352" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">DETAIL / Detalle consolidado</text><text x="46" y="383" font-family="Arial" font-size="17" font-weight="bold" fill="#16394c">Fecha del día | Operaciones | Bruto | Descuento | Cobrado</text><text x="46" y="407" font-family="Arial" font-size="14" fill="#40576b">ventas.fecha::date | COUNT(ventas.id) | SUM(ventas.subtotal_bruto)</text><text x="46" y="427" font-family="Arial" font-size="14" fill="#40576b">SUM(ventas.monto_descuento) | SUM(ventas.total_final) · agrupado por fecha</text><rect x="32" y="458" width="1136" height="112" rx="9" fill="#ffffff" stroke="#c6d5de"/><rect x="32" y="458" width="1136" height="29" rx="6" fill="#16566c"/><text x="46" y="478" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">GROUP FOOTER / Pie de grupo</text><text x="46" y="509" font-family="Arial" font-size="17" font-weight="bold" fill="#16394c">Subtotal mensual · Operaciones · Bruto · Descuentos · Cobrado</text><text x="46" y="533" font-family="Arial" font-size="14" fill="#40576b">Suma de los valores diarios del mismo mes.</text><text x="46" y="553" font-family="Arial" font-size="14" fill="#40576b">COUNT(ventas.id) y SUM de los importes, sin duplicar transacciones.</text><rect x="32" y="584" width="1136" height="112" rx="9" fill="#ffffff" stroke="#c6d5de"/><rect x="32" y="584" width="1136" height="29" rx="6" fill="#16566c"/><text x="46" y="604" font-family="Arial" font-size="15" font-weight="bold" fill="#ffffff">REPORT FOOTER / Pie del reporte</text><text x="46" y="635" font-family="Arial" font-size="17" font-weight="bold" fill="#16394c">Gran total de todos los meses · Página X de Y</text><text x="46" y="659" font-family="Arial" font-size="14" fill="#40576b">Suma de los subtotales mensuales; no se suman detalles de productos.</text><text x="46" y="679" font-family="Arial" font-size="14" fill="#40576b">Página X de Y: calculada por ReporteVentas.Paginas().</text></svg>